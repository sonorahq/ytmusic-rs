[package]
name = "ytmusic"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "YouTube Music InnerTube client"

[features]
bundled-sqlite = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
log = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
reqwest_cookie_store = "0.9"
cookie_store = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
regex-lite = "0.1"
rquickjs = "0.12"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
